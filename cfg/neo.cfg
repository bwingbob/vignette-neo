MEMORY {
    ZP:   start = $0020, size = $00C0, type = rw, define = yes;
    RAM:  start = $0400, size = $FC00-$0400, type = rw, define = yes;
    CODE: start = $1000, size = $F000-$1000, type = ro, file = %O, define = yes;
}

SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    BSS:      load = RAM,  type = bss, define = yes;
    CODE:     load = CODE, type = ro;
    RODATA:   load = CODE, type = ro;
    DATA:     load = CODE, type = rw, run = RAM, define = yes;
}
